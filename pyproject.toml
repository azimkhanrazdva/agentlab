[project]
name = "agentlab"
version = "0.1.0"
description = "Open-source DevTools and security testing platform for AI agents."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [
  "apps/api",
  "packages/gateway",
  "packages/tracing",
  "packages/providers",
  "packages/policies",
  "packages/security",
  "packages/attacks",
]

[tool.setuptools.packages.find]
where = [
  "apps/api",
  "packages/gateway",
  "packages/tracing",
  "packages/providers",
  "packages/policies",
  "packages/security",
  "packages/attacks",
]
include = ["agentlab_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
